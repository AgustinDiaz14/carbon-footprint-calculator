<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="scripts/main.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gray-100">
        <div class="container mx-auto px-4 py-8 h-screen w-full justify-center items-center flex flex-col">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Carbon Footprint Calculator</h1>
            
            <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-md">
                <form id="carbonForm">
                    <div class="mb-4">
                        <label for="kmCar" class="block text-sm font-medium text-gray-700 mb-2">Car Distance (km)</label>
                        <input type="number" id="kmCar" name="kmCar" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="mb-4">
                        <label for="flights" class="block text-sm font-medium text-gray-700 mb-2">Flights</label>
                        <input type="number" id="flights" name="flights" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="mb-6">
                        <label for="electricity" class="block text-sm font-medium text-gray-700 mb-2">Electricity Consumed (kWh)</label>
                        <input type="number" id="electricity" name="electricity" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Calculate</button>
                </form>
                
                <div id="result" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-md hidden opacity-0 transition-all duration-500">
                    <h3 class="text-lg font-semibold text-green-800 mb-2">Your Carbon Footprint</h3>
                    <p id="resultValue" class="text-2xl font-bold text-green-600"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
