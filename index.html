<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="transition-colors duration-300">
    <div class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 dark:from-gray-900 dark:to-green-900">
        <!-- Theme Toggle -->
        <div class="absolute top-4 right-4">
            <button id="themeToggle" class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition-all">
                <span class="text-2xl">🌙</span>
            </button>
        </div>
        
        <div class="container mx-auto px-4 py-8 h-screen w-full justify-center items-center flex flex-col">
            <h1 class="text-4xl font-bold text-center text-green-800 dark:text-green-300 mb-2">🌱 Carbon Footprint Calculator</h1>
            <p class="text-green-600 dark:text-green-400 text-center mb-8">Track your environmental impact</p>
            
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-6 w-full max-w-2xl border border-green-100 dark:border-gray-700">
                <!-- Category Selection -->
                <div class="flex mb-6 bg-green-50 dark:bg-gray-700 rounded-lg p-1">
                    <button type="button" id="carTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors bg-green-600 text-white">🚗 Car</button>
                    <button type="button" id="flightTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:text-green-700 dark:hover:text-green-400">✈️ Flights</button>
                    <button type="button" id="electricityTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:text-green-700 dark:hover:text-green-400">⚡ Electricity</button>
                </div>
                
                <div class="flex gap-6">
                    <!-- Calculator Section -->
                    <div class="flex-1">
                        <form id="carbonForm">
                            <!-- Car Section -->
                            <div id="carSection" class="category-section">
                                <div class="mb-4">
                                    <label for="kmCar" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Car Distance (km)</label>
                                    <input type="number" id="kmCar" name="kmCar" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                </div>
                            </div>
                            
                            <!-- Flight Section -->
                            <div id="flightSection" class="category-section hidden">
                                <div class="mb-4">
                                    <label for="flights" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Number of Flights</label>
                                    <input type="number" id="flights" name="flights" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                </div>
                            </div>
                            
                            <!-- Electricity Section -->
                            <div id="electricitySection" class="category-section hidden">
                                <div class="mb-4">
                                    <label for="electricity" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Electricity Consumed (kWh)</label>
                                    <input type="number" id="electricity" name="electricity" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                </div>
                            </div>
                            
                            <button type="submit" class="w-full bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 font-medium transition-colors">🧮 Calculate Impact</button>
                        </form>
                        
                        <div id="result" class="mt-6 p-4 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-lg hidden opacity-0 transition-all duration-500">
                            <h3 class="text-lg font-semibold text-green-800 dark:text-green-300 mb-2">🌍 Your Carbon Footprint</h3>
                            <p id="resultValue" class="text-2xl font-bold text-green-600 dark:text-green-400"></p>
                        </div>
                    </div>
                    
                    <!-- History Section -->
                    <div class="flex-1 border-l border-green-200 dark:border-gray-600 pl-6">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-4">📊 History</h3>
                        <div id="history" class="space-y-2 max-h-64 overflow-y-auto">
                            <p class="text-gray-500 dark:text-gray-400 text-sm">No calculations yet</p>
                        </div>
                        <button id="clearHistory" class="mt-4 text-sm text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 hidden">🗑️ Clear History</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
