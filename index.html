<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gray-100">
        <div class="container mx-auto px-4 py-8 h-screen w-full justify-center items-center flex flex-col">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Carbon Footprint Calculator</h1>
            
            <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-2xl">
                <!-- Category Selection -->
                <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
                    <button type="button" id="carTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white">Car</button>
                    <button type="button" id="flightTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-800">Flights</button>
                    <button type="button" id="electricityTab" class="flex-1 py-2 px-4 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-800">Electricity</button>
                </div>
                
                <div class="flex gap-6">
                    <!-- Calculator Section -->
                    <div class="flex-1">
                        <form id="carbonForm">
                            <!-- Car Section -->
                            <div id="carSection" class="category-section">
                                <div class="mb-4">
                                    <label for="kmCar" class="block text-sm font-medium text-gray-700 mb-2">Car Distance (km)</label>
                                    <input type="number" id="kmCar" name="kmCar" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <!-- Flight Section -->
                            <div id="flightSection" class="category-section hidden">
                                <div class="mb-4">
                                    <label for="flights" class="block text-sm font-medium text-gray-700 mb-2">Number of Flights</label>
                                    <input type="number" id="flights" name="flights" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <!-- Electricity Section -->
                            <div id="electricitySection" class="category-section hidden">
                                <div class="mb-4">
                                    <label for="electricity" class="block text-sm font-medium text-gray-700 mb-2">Electricity Consumed (kWh)</label>
                                    <input type="number" id="electricity" name="electricity" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Calculate</button>
                        </form>
                        
                        <div id="result" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-md hidden opacity-0 transition-all duration-300">
                            <h3 class="text-lg font-semibold text-green-800 mb-2">Your Carbon Footprint</h3>
                            <p id="resultValue" class="text-2xl font-bold text-green-600"></p>
                        </div>
                    </div>
                    
                    <!-- History Section -->
                    <div class="flex-1 border-l border-gray-200 pl-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">History</h3>
                        <div id="history" class="space-y-2 max-h-64 overflow-y-auto">
                            <p class="text-gray-500 text-sm">No calculations yet</p>
                        </div>
                        <button id="clearHistory" class="mt-4 text-sm text-red-600 hover:text-red-800 hidden">Clear History</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
